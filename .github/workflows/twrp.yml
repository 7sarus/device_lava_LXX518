name: twrp

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: tree

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -g

      - name: Install packages
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32z1-dev libelf-dev libncurses-dev libssl-dev libxml2-utils \
            lz4 lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync manifest
        run: |
          mkdir -p twrp && cd twrp
          "$HOME/bin/repo" init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1 --depth=1 --no-clone-bundle
          "$HOME/bin/repo" sync -c -j4 --no-tags --force-sync --no-clone-bundle
          df -h /

      - name: Add device tree
        run: |
          mkdir -p twrp/device/lava
          rsync -a --exclude .git --exclude .github tree/ twrp/device/lava/LXX518/

      - name: Build
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_LXX518-ap2a-eng
          m bootimage -j4

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-LXX518
          path: |
            twrp/out/target/product/LXX518/boot.img
            twrp/out/target/product/LXX518/recovery.img
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: twrp/out/verbose.log.gz
          if-no-files-found: warn
